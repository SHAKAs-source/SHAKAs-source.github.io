<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHADRACK APOLLO - Portfolio</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        /* Base Page & Animated Mesh Background Styling */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(125deg, #0f172a, #1e1b4b, #020617);
            background-size: 400% 400%;
            animation: meshGradient 15s ease infinite;
            color: #f8fafc;
            line-height: 1.6;
            padding: 60px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        @keyframes meshGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Section Container */
        .glass-panel {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Profile Layout Structure */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
            flex-wrap: wrap-reverse;
        }
        .header-text {
            flex: 1;
            min-width: 300px;
        }
        .profile-img-container {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #6366f1;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
            flex-shrink: 0;
        }
        .profile-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Typography */
        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin: 0 0 8px 0;
            color: #ffffff;
            background: linear-gradient(to right, #ffffff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        h2 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            text-transform: uppercase;
            color: #818cf8;
            margin-top: 50px;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.1rem;
            color: #cbd5e1;
            margin-bottom: 24px;
        }

        /* Divider Lines */
        hr {
            border: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 40px 0;
        }

        /* Skills Lists */
        .skills-container {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
        }
        .skills-column {
            flex: 1;
            min-width: 250px;
        }
        .skills-column strong {
            display: block;
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: #ffffff;
        }
        .skills-column ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .skills-column li {
            padding: 8px 0;
            color: #94a3b8;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 1.05rem;
        }

        /* Projects Section Grid */
        .projects-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .project-card {
            background-color: rgba(15, 23, 42, 0.6);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        /* Project Card Hover Interactions */
        .project-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
            border-color: #6366f1;
        }
        .project-card h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .project-card p {
            margin-bottom: 0;
            font-size: 1rem;
            color: #94a3b8;
        }

        /* Contact Details */
        .contact-info p {
            margin: 8px 0;
            font-size: 1.1rem;
        }
        .contact-info strong {
            color: #ffffff;
        }

        /* Social Media Link Buttons */
        .social-links {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        .social-btn {
            display: inline-flex;
            align-items: center;
            padding: 10px 20px;
            background-color: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }
        .social-btn:hover {
            background-color: #6366f1;
            color: #ffffff;
            border-color: #6366f1;
        }
    </style>
</head>
<body>
    <!-- Wrap all inner elements inside the glass panel container -->
    <div class="glass-panel">
